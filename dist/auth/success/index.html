<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Registration successful | SheSafe</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: 32px 16px;
        background: #ffffff;
        color: #2c2421;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }

      main {
        width: min(600px, 100%);
        text-align: center;
      }

      p.brand {
        margin: 0 0 8px;
        color: #ea51a1;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(30px, 8vw, 42px);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #7a6e66;
        font-size: 16px;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">SheSafe</p>
      <h1>Registration successful</h1>
      <p>You can return to SheSafe and continue sign-in.</p>
    </main>
  </body>
</html>
