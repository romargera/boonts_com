name: Recover Coolify Origin

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coolify-recover-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.MAC_ROMAN_DEPLOY }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
    steps:
      - name: Validate secrets
        run: |
          set -euo pipefail
          test -n "${COOLIFY_API_URL:-}" || (echo "Missing COOLIFY_API_URL" && exit 1)
          test -n "${COOLIFY_API_TOKEN:-}" || (echo "Missing COOLIFY_API_TOKEN" && exit 1)
          test -n "${COOLIFY_APP_UUID:-}" || (echo "Missing COOLIFY_APP_UUID" && exit 1)

      - name: Trigger deploy
        id: trigger
        run: |
          set -euo pipefail
          response="$(curl -fsS -X POST \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"force": true}' \
            "${COOLIFY_API_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}")"
          echo "$response"
          deployment_uuid="$(echo "$response" | jq -r '.deployments[0].deployment_uuid // empty')"
          test -n "$deployment_uuid" || (echo "No deployment_uuid in response" && exit 1)
          echo "deployment_uuid=${deployment_uuid}" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        env:
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            deployment="$(curl -fsS \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              "${COOLIFY_API_URL%/}/api/v1/deployments/${DEPLOYMENT_UUID}")"
            status="$(echo "$deployment" | jq -r '.status // "unknown"')"
            echo "Attempt ${attempt}: ${status}"
            case "$status" in
              finished)
                exit 0
                ;;
              failed|canceled)
                echo "$deployment"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for deployment result"
          exit 1
